<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me passe seu contato</title>
    <link rel="shortcut icon" href="../favicon-16x16.png" type="image/x-icon">
</head>
<body>
    <h2>Formulário de Contato</h2>

    <form action="">
        <label for="nome">Nome Completo:</label> <br>
        <input type="text" />
            <br><br>

        <label for="email">E-mail:</label> <br>
        <input type="email" />
            <br><br>

        <label for="telefone">Seu número de telefone:</label> <br>
        <input type="text" />
            <br><br>

        <label for="tipopessoa">É pessoa física ou jurídica:</label> <br>

        <input type="radio" id="jurídica" name="Pessoa"/>
        <label for="jurídica">jurídica</label> <br>

        <input type="radio" id="física" name="Pessoa"/>
        <label for="física">física</label>
            <br><br>

        <label for="horario">Melhor horário para contato:</label> <br>

        <input type="checkbox" id="Entre 08:00 e 10:00" name="horario">
        <label for="horario">Entre 08:00 e 10:00</label> <br>

        <input type="checkbox" id="Entre 10:00 e 12:00" name="horario">
        <label for="horario">Entre 10:00 e 12:00</label> <br>

        <input type="checkbox" id="Entre 14:00 e 16:00" name="horario">
        <label for="horario">Entre 14:00 e 16:00</label> <br>

        <input type="checkbox" id="Entre 16:00 e 18:00" name="horario">
        <label for="horario">Entre 16:00 e 18:00</label> <br>
            <br><br>

        <label for="servico">Qual tipo de serviço deseja:</label> <br>
            <a href="../servicos/meusservicos.html">Clique aqui para consultar os serviços</a> <br>
        <input type="radio" id="HomePage" name="servico"/>
        <label for="HomePage">HomePage</label> <br>

        <input type="radio" id="Página Estáticae" name="servico"/>
        <label for="HomePage">Página Estática</label> <br>

        <input type="radio" id="Página Dinâmica" name="servico"/>
        <label for="HomePage">Página Dinâmica</label> <br>

        <input type="radio" id="Página Avançada" name="servico"/>
        <label for="HomePage">Página Avançada</label> <br>
            <br><br>

        <label for="descricao">Descreva um pouco sobre o que deseja contratar:</label>
        <input type="textbox">
            <br><br>
    </form>

    <a href="../index.html">Voltar</a>
</body>
</html>
